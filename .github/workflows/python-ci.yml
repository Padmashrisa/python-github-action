name: Python CI Pipeline

on:
  push:
    branches:
      - main
      

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: run python application
      run: python app.py

    - name: run unit tests
      run: python -m unittest -v
